services:
  - type: web
    # Must match the existing service, or Render treats this blueprint as a new
    # service and creates a second one. The live service is `law_saathi`
    # (srv-dase35m0tbcc73f0qcu0) at https://law-saathi.onrender.com — note the
    # underscore here and the hyphen in the hostname, which is Render's doing.
    # This file previously said `lawsathi-api`, which was never how the service
    # was actually created, so anyone applying it would have got a duplicate.
    name: law_saathi
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Groq meters tokens per day *per model*, and gpt-oss-120b exhausted its
      # 200k allowance on 2026-10-14 with every other provider already at zero
      # credit — which took production down to the template answer. These are
      # the same key, same provider, separate allowances, tried in order after
      # the primary model 429s.
      - key: GROQ_FALLBACK_MODELS
        value: openai/gpt-oss-20b,qwen/qwen3.8-27b
      # NOTE: OpenCode Zen no longer works as a last resort. Its free tier
      # returns 403 "can only be used from within OpenCode" to any server-side
      # caller, and the paid models return 402 with no account funds. Kept
      # wired up in case funds are added, but it is not a free safety net and
      # should not be counted as one.
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_MODEL
        value: space-bunny-free
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Voice input: Sarvam SAAR is the first-choice STT (Indian accents,
      # Hinglish, Kannada). If it is absent or returns no transcript, GROQ_API_KEY
      # above carries voice via Whisper — so do not treat this as optional just
      # because chat works without it.
      - key: SARVAM_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      # LangSmith tracing is opt-in: the free tier allows 5k traces/month
      # and a single question costs ~6 node traces. "errors" traces only the
      # runs that went wrong, so the allowance lasts.
      - key: LAWSAATHI_TRACE
        value: errors
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: lawsathi

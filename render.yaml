services:
  - type: web
    name: lawsathi-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      # LangSmith tracing is opt-in: the free tier allows 5k traces/month
      # and a single question costs ~6 node traces. "errors" traces only the
      # runs that went wrong, so the allowance lasts.
      - key: LAWSAATHI_TRACE
        value: errors
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: lawsathi

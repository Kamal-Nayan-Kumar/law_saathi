# Deploys the web app to Vercel.
#
# WHY THIS IS MANUAL BY DEFAULT
#
# Vercel can deploy from Git pushes two ways, and running both at once means two
# builds racing to alias the same domain:
#
#   A) The Vercel GitHub App (project -> Settings -> Git). Native, no secrets,
#      deploy previews, logs live in the Vercel dashboard.
#   B) This workflow. Version-controlled, logs live in GitHub, builds the app
#      first so a broken commit never reaches production.
#
# Pick ONE. If you connect the GitHub App, delete this file — otherwise every
# push builds twice and whichever finishes last wins the alias.
#
# To use THIS instead of the App, replace the `on:` block below with:
#
#   on:
#     push:
#       branches: [main]
#
# ------------------------------------------------------------------
# SETUP (once)
#   1. Vercel dashboard -> Settings -> Tokens -> Create Token
#      (scope: this project). Copy it.
#   2. GitHub -> Settings -> Secrets and variables -> Actions -> New
#      repository secret. Add all three:
#        VERCEL_TOKEN       = the token from step 1
#        VERCEL_ORG_ID      = team_IkaZrHgE3Fo0Z6TvAa5I5Z7o
#        VERCEL_PROJECT_ID  = prj_D9WjsbU8cUQsezRjzslAfISH6CIN
#   3. Run this workflow once from the Actions tab.
# ------------------------------------------------------------------

name: Deploy web (Vercel)

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Deploy to production (unchecked = preview)"
        type: boolean
        default: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the web app
        # A bad commit should fail here, not become a broken production alias.
        # Plain `next build` on purpose: Next 16 removed `--no-lint` and already
        # typechecks during the build, so there is nothing to opt out of.
        working-directory: web
        run: npm ci && npm run build
        env:
          # The build reads these while prerendering. CI has no access to the
          # real values and the build only needs them to be present.
          NEON_AUTH_BASE_URL: "https://placeholder.invalid/auth"
          NEON_AUTH_COOKIE_SECRET: "placeholder-not-used-at-build-time"
          INTERNAL_API_SECRET: "placeholder-not-used-at-build-time"
          FASTAPI_URL: "https://placeholder.invalid"

      - name: Deploy to Vercel
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ "${{ inputs.production }}" = "true" ]; then
            npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
          else
            npx vercel deploy --yes --token "$VERCEL_TOKEN"
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Web deploy"
            echo
            echo "- commit: \`${GITHUB_SHA::8}\`"
            echo "- branch: \`${GITHUB_REF_NAME}\`"
            echo "- production: \`${{ inputs.production }}\`"
          } >> "$GITHUB_STEP_SUMMARY"